<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>PvY Admin</title>
<link rel="icon" href="../assets/favicon.png">
<style>
:root{--bg:#0b0f1e;--card:#141a30;--line:#262f52;--tx:#e8ecff;--mut:#8b94b8;--g:#3ddc84;--y:#ffd23f;--r:#ff5d6c;--b:#5fb4ff;--o:#ff9f43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,15,30,.95);z-index:5;flex-wrap:wrap}
header img{height:26px}header h1{font-size:17px;margin:0}header .sp{flex:1}
.pill{padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:12px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button{cursor:pointer}button:hover{border-color:var(--b)}
main{padding:20px 22px;max-width:1500px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.st small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.st b{display:block;font-size:26px;margin-top:4px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;min-width:0}
.box h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}.box h2 .c{color:var(--mut);font-weight:400;font-size:13px}
.tw{overflow:auto;max-height:560px}
table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid rgba(38,47,82,.6);white-space:nowrap}tr.p{cursor:pointer}tr.p:hover td{background:rgba(95,180,255,.07)}tr.sel td{background:rgba(95,180,255,.13)}
.num{text-align:right;font-variant-numeric:tabular-nums}.mono{font-family:ui-monospace,Consolas,monospace}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#555}.dot.on{background:var(--g);box-shadow:0 0 8px var(--g)}.dot.idle{background:var(--o)}
.al{display:flex;gap:10px;padding:9px 10px;border-radius:9px;margin-bottom:7px;background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.3)}
.al.w{background:rgba(255,159,67,.08);border-color:rgba(255,159,67,.3)}.al b{color:var(--r)}.al.w b{color:var(--o)}.al small{color:var(--mut)}
.feed div{padding:6px 2px;border-bottom:1px solid rgba(38,47,82,.6);font-size:13px}.feed time{color:var(--mut);margin-right:8px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;background:#222a4a;margin-right:6px}
.t-wave{color:var(--b)}.t-crash{color:var(--r)}.t-session_start{color:var(--g)}.t-session_end{color:var(--mut)}.t-click{color:var(--y)}
.mut{color:var(--mut)}.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}
#login{max-width:380px;margin:12vh auto;text-align:center}#login img{width:240px}#login input{width:100%;margin:14px 0 10px;padding:11px}#login button{width:100%;padding:11px;background:var(--g);color:#06210f;border:0;font-weight:700}
#err{color:var(--r);min-height:20px}
svg.spark{width:100%;height:120px;display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:10px}.kv div{background:#10162b;border-radius:8px;padding:8px}.kv small{color:var(--mut);display:block;font-size:11px}
.hidden{display:none!important}
.bn{background:#3a1018;border-color:#ff5d6c;color:#ffb3bb}.bn:hover{background:#5a1824}.ub{background:#10301e;border-color:#3ddc84;color:#9ff0c2}.sm{padding:3px 9px;font-size:12px;margin-top:5px}
tr.ban td{opacity:.55}tr.ban td:first-child,tr.ban td:nth-child(2){opacity:1}
</style></head><body>
<div id="login"><img src="../assets/logo.webp" alt=""><h2>Admin Paneli</h2><input id="tok" type="password" placeholder="Admin anahtarı" autocomplete="off"><button id="go">Giriş</button><p id="err"></p></div>
<div id="app" class="hidden">
<header><img src="../assets/logo.webp" alt=""><h1>Admin</h1><span class="pill" id="upd">—</span><span class="sp"></span>
<select id="hrs"><option value="1">Son 1 saat</option><option value="6">Son 6 saat</option><option value="24" selected>Son 24 saat</option><option value="72">Son 3 gün</option><option value="168">Son 7 gün</option></select>
<a href="../?play=1" target="_blank" rel="noopener" style="text-decoration:none"><button style="background:#ffd23f;color:#2a1300;border:0;font-weight:800">🎮 Oyuna gir</button></a>
<button id="ref">Yenile</button><button id="out">Çıkış</button></header>
<main>
<div class="stats" id="stats"></div>
<div class="grid"><div>
<div class="box"><h2>Oyuncular <span class="c" id="pc"></span></h2><div class="tw"><table><thead><tr><th>Cüzdan</th><th>Durum</th><th>Son görülme</th><th class="num">Giriş</th><th class="num">Coin</th><th class="num">Kazanılan</th><th class="num">Dalga</th><th class="num">Bag</th><th class="num">Banka</th><th class="num">Havuz payı</th><th>NFT</th><th>Cihaz</th></tr></thead><tbody id="pl"></tbody></table></div></div>
<div class="box hidden" id="det"></div>
<div class="box"><h2>🌱 Waitlist başvuruları <span class="c" id="wlc"></span></h2>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><input id="wlPost" placeholder="Waitlist postunun linki (https://x.com/PlantVsYield/status/…)" style="flex:1;min-width:260px"><button id="wlSet">Kaydet</button></div>
<p class="mut" id="wlPostNow" style="margin:0 0 10px;font-size:13px"></p>
<div class="tw"><table><thead><tr><th>Tarih</th><th>X hesabı</th><th>Cüzdan</th><th>Alıntı</th><th>Yorum</th><th>Durum</th><th></th></tr></thead><tbody id="wlList"></tbody></table></div></div>
</div><div>
<div class="box"><h2>⚠️ Şüpheli işlemler <span class="c" id="ac"></span></h2><div id="al"></div></div>
<div class="box"><h2>Canlı akış <span class="c">kim ne yapıyor</span></h2><div class="feed tw" id="fd"></div></div>
</div></div>
</main></div>
<script>
const API = 'https://rbfcjqpkdketyagczmms.supabase.co/rest/v1/rpc/pvy_admin', KEY = 'sb_publishable_ysut6eIPimuX8bM3UXc0bA_nm69VC-A';
const ALLOW = ['0xadc8f313c7205d4def2545460037b3e4260e383f', '0x89ce61c89f78274eb8d85ff9a455f6331765bdf9'];
const NAMES = { '0xadc8f313c7205d4def2545460037b3e4260e383f': 'sen', '0x89ce61c89f78274eb8d85ff9a455f6331765bdf9': 'Talha' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const F = v => { v = +v || 0; const a = Math.abs(v); return a >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : a >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : a >= 1e3 ? (v / 1e3).toFixed(1) + 'K' : v.toFixed(a < 10 ? 1 : 0); };
const short = a => a.slice(0, 6) + '…' + a.slice(-4);
const who = a => short(a) + (NAMES[a] ? ' <span class="mut">(' + NAMES[a] + ')</span>' : '');
const ago = ms => { const s = Math.max(0, ms / 1000 | 0); return s < 60 ? s + ' sn önce' : s < 3600 ? (s / 60 | 0) + ' dk önce' : s < 86400 ? (s / 3600 | 0) + ' sa önce' : (s / 86400 | 0) + ' gün önce'; };
const hm = t => new Date(t).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const dev = ua => !ua ? '—' : (/Mobile|Android|iPhone/.test(ua) ? '📱 ' : '💻 ') + (/Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox/.test(ua) ? 'Firefox' : /Safari/.test(ua) ? 'Safari' : 'Diğer');
let tok = ''; try { localStorage.removeItem('pvy_admin_tok'); } catch (e) {}
let D = null, sel = null, timer = null;
const isBan = w => !!(D && D.bans && D.bans.some(b => b.wallet === w));
async function setBan(w, on) {
  let reason = null;
  if (on) { reason = prompt(short(w) + ' cüzdanını yasakla.\nSebep (oyuncu bunu görecek, boş bırakabilirsin):', ''); if (reason === null) return; }
  else if (!confirm(short(w) + ' cüzdanının yasağı kaldırılsın mı?')) return;
  const r = await fetch(API.replace('pvy_admin', 'pvy_ban'), { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ p_token: tok, p_wallet: w, p_ban: on, p_reason: reason || null }) });
  if (!r.ok) return alert('Olmadı: ' + r.status);
  await load();
}

async function load() {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ p_token: tok, p_hours: +$('hrs').value }) });
  if (!r.ok) throw new Error(r.status === 400 || r.status === 401 ? 'unauthorized' : 'HTTP ' + r.status);
  D = await r.json(); render(); wl();
}
async function wl(post, remove) {
  const r = await fetch(API.replace('pvy_admin', 'pvy_wl_admin'), { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ p_token: tok, p_post: post == null ? null : post, p_remove: remove || null }) });
  if (!r.ok) return; const W = await r.json();
  $('wlc').textContent = W.list.length + ' kişi';
  $('wlPostNow').innerHTML = W.post ? 'Şu anki post: <a target="_blank" rel="noopener" style="color:#ffd23f" href="https://x.com/PlantVsYield/status/' + esc(W.post) + '">x.com/PlantVsYield/status/' + esc(W.post) + '</a>' : '<span class="r">Post ayarlanmadı: sitede “Waitlist opens soon” görünüyor.</span>';
  const tw = (u, id) => '<a target="_blank" rel="noopener" style="color:#5fb4ff" href="https://x.com/' + esc(u) + '/status/' + esc(id) + '">aç ↗</a>';
  $('wlList').innerHTML = W.list.map(x => '<tr><td>' + hm(x.ts) + '</td><td>' + (x.avatar ? '<img src="' + esc(x.avatar) + '" style="width:20px;height:20px;border-radius:50%;vertical-align:middle;margin-right:6px">' : '') + '<a target="_blank" rel="noopener" href="https://x.com/' + esc(x.x_user) + '">@' + esc(x.x_user) + '</a></td><td class="mono">' + short(x.wallet) + ' <button class="sm" data-copy="' + esc(x.wallet) + '">kopyala</button></td><td>' + tw(x.x_user, x.quote_id) + '</td><td>' + tw(x.x_user, x.reply_id) + '</td><td>' + ({ ok: '<span class="g">✔ doğrulandı</span>', pending: '<span class="y">⏳ beklemede</span>', rejected: '<span class="r">✗ reddedildi</span>' }[x.status] || esc(x.status)) + (x.status !== 'ok' ? ' <button class="sm" data-wlre="' + esc(x.wallet) + '">tekrar kontrol</button>' : '') + '</td><td><button class="bn sm" data-wlrm="' + esc(x.wallet) + '">Sil</button></td></tr>').join('') || '<tr><td colspan="7" class="mut">Henüz başvuru yok.</td></tr>';
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (c) { navigator.clipboard.writeText(c.dataset.copy); c.textContent = 'kopyalandı'; return; }
  const re = e.target.closest('[data-wlre]'); if (re) { re.textContent = 'kontrol ediliyor…'; re.disabled = true; fetch(API.replace('pvy_admin', 'pvy_wl_recheck'), { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ p_token: tok, p_wallet: re.dataset.wlre }) }).then(() => wl()); return; }
  const d = e.target.closest('[data-wlrm]'); if (d && confirm(short(d.dataset.wlrm) + ' başvurusu silinsin mi?')) wl(null, d.dataset.wlrm);
  if (e.target.id === 'wlSet') { const v = $('wlPost').value.trim(); if (!/\/status\/\d+/.test(v) && !/^\d+$/.test(v)) return alert('Geçerli bir post linki yapıştır.'); wl(v).then(() => { $('wlPost').value = ''; }); }
});
async function start() {
  $('err').textContent = '';
  try { await load(); $('login').classList.add('hidden'); $('app').classList.remove('hidden'); clearInterval(timer); timer = setInterval(() => load().catch(() => {}), 15000); }
  catch (e) { $('err').textContent = /unauth|400|401/.test(e.message) ? 'Anahtar yanlış.' : 'Bağlanılamadı: ' + e.message; }
}

function alerts() {
  const out = [], now = Date.parse(D.now), by = {};
  for (const s of D.snaps) (by[s.wallet] = by[s.wallet] || []).push(s);
  for (const p of D.players) if (!ALLOW.includes(p.wallet)) out.push({ lv: 'r', w: p.wallet, t: p.last_seen, m: 'İzin listesinde olmayan cüzdan veri gönderdi', d: 'Kapıyı atlayıp oyuna girmiş ya da sunucuya doğrudan istek atmış olabilir.' });
  for (const [w, list] of Object.entries(by)) {
    const sids = {};
    for (const s of list) (sids[s.sid] = sids[s.sid] || []).push(s);
    // aynı anda birden fazla oturum
    const ranges = Object.entries(sids).map(([k, v]) => [k, Date.parse(v[0].ts), Date.parse(v[v.length - 1].ts)]);
    for (let i = 0; i < ranges.length; i++) for (let j = i + 1; j < ranges.length; j++) {
      const a = ranges[i], b = ranges[j];
      if (a[1] < b[2] - 30000 && b[1] < a[2] - 30000) { out.push({ lv: 'w', w, t: new Date(Math.min(a[2], b[2])).toISOString(), m: 'Aynı anda birden fazla sekme/cihaz', d: 'İki oturum aynı anda açık kalmış (kopyalama/birleştirme hilesi denemesi olabilir).' }); i = ranges.length; break; }
    }
    for (const v of Object.values(sids)) for (let i = 1; i < v.length; i++) {
      const a = v[i - 1].snap || {}, b = v[i].snap || {}, dt = (Date.parse(v[i].ts) - Date.parse(v[i - 1].ts)) / 1000;
      if (dt <= 0 || dt > 120 || b.wave < a.wave) continue;
      const dc = (b.coins || 0) - (a.coins || 0), de = (b.earned || 0) - (a.earned || 0);
      if (dc > Math.max(500, de * 1.5 + 200)) out.push({ lv: 'r', w, t: v[i].ts, m: 'Açıklanamayan coin artışı: +' + F(dc), d: dt.toFixed(0) + ' sn içinde coin ' + F(a.coins) + ' → ' + F(b.coins) + ', ama kazanılan sadece +' + F(de) + '. (Kutu ödülü de olabilir, kontrol et.)' });
      const db = (b.bank || 0) - (a.bank || 0);
      if (db > 1000 && db > (a.bank || 0) * 4) out.push({ lv: 'w', w, t: v[i].ts, m: 'Bankada ani artış: +' + F(db), d: F(a.bank) + ' → ' + F(b.bank) + ' (' + dt.toFixed(0) + ' sn). Günlük dağıtım saati değilse şüpheli.' });
      if (b.wave - a.wave > 3) out.push({ lv: 'w', w, t: v[i].ts, m: 'Dalga atlaması: ' + a.wave + ' → ' + b.wave, d: dt.toFixed(0) + ' sn içinde.' });
    }
  }
  // çok hızlı tıklama
  const cl = {};
  for (const e of D.events) if (e.type === 'click') { const k = e.wallet + '|' + Math.floor(Date.parse(e.ts) / 20000); cl[k] = (cl[k] || 0) + 1; }
  for (const [k, n] of Object.entries(cl)) if (n >= 45) { const [w, b] = k.split('|'); out.push({ lv: 'w', w, t: new Date(b * 20000).toISOString(), m: '20 saniyede ' + n + ' tıklama', d: 'Otomatik tıklama (bot) olabilir.' }); }
  return out.sort((a, b) => Date.parse(b.t) - Date.parse(a.t));
}

function render() {
  const now = Date.parse(D.now), P = D.players;
  const on = p => now - Date.parse(p.last_seen) < 60000, act = p => now - Date.parse(p.last_seen) < 86400000;
  const sum = k => P.reduce((s, p) => s + (+(p.snap || {})[k] || 0), 0);
  const st = [['Şu an online', P.filter(on).length, 'g'], ['Son 24 saat aktif', P.filter(act).length], ['Toplam kayıt', P.length], ['Toplam giriş', P.reduce((s, p) => s + p.sessions, 0)],
    ['NFT mint eden', P.filter(p => (p.snap || {}).minted).length, 'y'], ['Toplam kazanılan coin', F(sum('earned'))], ['Bankalardaki toplam', F(sum('bank')), 'y'], ['Havuza yatırılan', F(sum('mine'))], ['Yasaklı', (D.bans || []).length, 'r'], ['En yüksek dalga', Math.max(0, ...P.map(p => (p.snap || {}).wave || 0))]];
  $('stats').innerHTML = st.map(s => '<div class="st"><small>' + s[0] + '</small><b class="' + (s[2] || '') + '">' + s[1] + '</b></div>').join('');
  $('pc').textContent = P.length + ' cüzdan';
  $('pl').innerHTML = P.map(p => { const s = p.snap || {}, o = on(p), idle = o && (s.vis === 'hidden' || s.paused);
    const bn = isBan(p.wallet);
    return '<tr class="p' + (sel === p.wallet ? ' sel' : '') + (bn ? ' ban' : '') + '" data-w="' + esc(p.wallet) + '"><td class="mono">' + who(p.wallet) + '</td><td>' + (bn ? '<b class="r">⛔ Yasaklı</b> ' : '') + '<span class="dot ' + (o ? idle ? 'idle' : 'on' : '') + '"></span>' + (o ? idle ? 'Arka planda' : (s.crashed ? 'Çöktü' : 'Oynuyor') : 'Çevrimdışı') + '</td><td>' + ago(now - Date.parse(p.last_seen)) + '</td><td class="num">' + p.sessions +
      '</td><td class="num">' + F(s.coins) + '</td><td class="num">' + F(s.earned) + '</td><td class="num">' + (s.wave || 0) + '</td><td class="num">' + F(s.bag) + '</td><td class="num y">' + F(s.bank) + '</td><td class="num">' + F(s.mine) + '</td><td>' + (s.minted ? ({ m: '👦 Erkek', f: '👧 Kız' }[(s.nft || '').split(':')[0]] || '✔') : '—') + '</td><td>' + dev(p.ua) + '</td></tr>'; }).join('') || '<tr><td colspan="12" class="mut">Henüz kimse girmedi.</td></tr>';
  const A = alerts(); $('ac').textContent = A.length ? A.length + ' uyarı' : 'temiz';
  $('al').innerHTML = A.slice(0, 40).map(a => '<div class="al ' + (a.lv === 'w' ? 'w' : '') + '"><div><b>' + esc(a.m) + '</b><br><span class="mono">' + who(a.w) + '</span> · <small>' + hm(a.t) + '</small><br><small>' + esc(a.d) + '</small><br>' + (isBan(a.w) ? '<small class="r">⛔ yasaklandı</small>' : '<button class="bn sm" data-ban="' + esc(a.w) + '">⛔ Yasakla</button>') + '</div></div>').join('') || '<p class="g">Şüpheli bir şey yok ✔</p>';
  $('fd').innerHTML = D.events.slice(0, 250).map(feedRow).join('') || '<p class="mut">Olay yok.</p>';
  $('upd').textContent = 'Güncellendi ' + new Date().toLocaleTimeString('tr-TR') + ' · 15 sn\'de bir yenilenir';
  if (sel) detail(sel);
}
const LBL = { session_start: 'Oyuna girdi', session_end: 'Çıktı', wave: 'Dalga', crash: 'Market çöktü', run_reset: 'Yeni tur', click: 'Tıkladı', banned: '⛔ Yasaklandı', unbanned: 'Yasak kalktı' };
function evText(e) { const d = e.data || {};
  if (e.type === 'wave') return 'Dalga ' + d.wave + "'e ulaştı";
  if (e.type === 'crash') return 'Çöktü (dalga ' + d.wave + ', coin ' + F(d.coins) + ')';
  if (e.type === 'click') return '“' + esc(d.el) + '”' + (d.type ? ' <span class="mut">(' + esc(d.type) + ')</span>' : '');
  if (e.type === 'banned') return 'Admin yasakladı' + (d.reason ? ': ' + esc(d.reason) : '');
  if (e.type === 'unbanned') return 'Admin yasağı kaldırdı';
  if (e.type === 'session_start') return 'Oyuna girdi <span class="mut">' + esc(d.screen || '') + '</span>';
  return LBL[e.type] || esc(e.type); }
const feedRow = e => '<div><time>' + hm(e.ts) + '</time><span class="mono">' + who(e.wallet) + '</span> <span class="tag t-' + esc(e.type) + '">' + (LBL[e.type] || esc(e.type)) + '</span>' + evText(e) + '</div>';

function spark(pts, key, color) {
  if (pts.length < 2) return '<p class="mut">Grafik için yeterli veri yok.</p>';
  const t0 = Date.parse(pts[0].ts), t1 = Date.parse(pts[pts.length - 1].ts), vs = pts.map(p => +(p.snap || {})[key] || 0), mx = Math.max(1, ...vs);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + ((Date.parse(p.ts) - t0) / Math.max(1, t1 - t0) * 600).toFixed(1) + ',' + (110 - vs[i] / mx * 100).toFixed(1)).join('');
  return '<svg class="spark" viewBox="0 0 600 120" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><small class="mut">en yüksek ' + F(mx) + '</small>';
}
function detail(w) {
  const p = D.players.find(x => x.wallet === w); if (!p) return;
  const s = p.snap || {}, sn = D.snaps.filter(x => x.wallet === w), ev = D.events.filter(x => x.wallet === w);
  const box = $('det'); box.classList.remove('hidden');
  box.innerHTML = '<h2>Oyuncu: <span class="mono">' + esc(w) + '</span> ' + (NAMES[w] ? '(' + NAMES[w] + ')' : '') + ' <span class="c">ilk giriş ' + hm(p.first_seen) + '</span><span style="flex:1"></span>' + (isBan(w) ? '<b class="r">⛔ Yasaklı</b> <button class="ub" data-unban="' + esc(w) + '">Yasağı kaldır</button>' : '<button class="bn" data-ban="' + esc(w) + '">⛔ Yasakla</button>') + '</h2>' +
    '<div class="kv">' + [['Coin', F(s.coins)], ['Kazanılan (tur)', F(s.earned)], ['Harcanan (tur)', F(s.spent)], ['Dalga', s.wave || 0], ['Kaçan zombi', s.leaks || 0], ['Bag', F(s.bag)], ['Banka', F(s.bank)], ['Havuz payı', F(s.mine)], ['Gelir/sn', F(s.dps)], ['Dil', s.lang || '—'], ['Toplam giriş', p.sessions], ['Cihaz', dev(p.ua)]].map(k => '<div><small>' + k[0] + '</small>' + k[1] + '</div>').join('') + '</div>' +
    '<h2>Coin <span class="c">seçili zaman aralığı</span></h2>' + spark(sn, 'coins', '#ffd23f') + '<h2 style="margin-top:12px">Banka</h2>' + spark(sn, 'bank', '#3ddc84') +
    '<h2 style="margin-top:12px">Bu oyuncunun hareketleri <span class="c">' + ev.length + '</span></h2><div class="feed tw" style="max-height:320px">' + (ev.slice(0, 300).map(feedRow).join('') || '<p class="mut">Olay yok.</p>') + '</div>' +
    '<p style="margin-top:10px"><button onclick="sel=null;document.getElementById(\'det\').classList.add(\'hidden\');render()">Kapat</button></p>';
}
$('pl').addEventListener('click', e => { const tr = e.target.closest('tr[data-w]'); if (!tr) return; sel = tr.dataset.w; render(); $('det').scrollIntoView({ behavior: 'smooth' }); });
document.addEventListener('click', e => { const b = e.target.closest('[data-ban],[data-unban]'); if (!b) return; e.stopPropagation(); if (b.dataset.ban) setBan(b.dataset.ban, true); else setBan(b.dataset.unban, false); }, true);

$('tok').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('ref').onclick = () => load().catch(e => alert(e.message));
$('hrs').onchange = () => load().catch(() => {});
