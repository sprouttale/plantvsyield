  @keyframes tw1{from{opacity:1}to{opacity:.35}}
  .sky .cl{inset:auto;border-radius:50%;filter:blur(18px);background:radial-gradient(ellipse at 50% 50%,rgba(120,140,210,.28),rgba(80,100,180,.12) 50%,transparent 70%);animation:drift 60s linear infinite}
  .sky .c1{width:520px;height:120px;top:14%;left:-10%}
  .sky .c2{width:420px;height:100px;top:30%;left:40%;animation-duration:85s;animation-delay:-30s}
  .sky .c3{width:600px;height:140px;top:6%;left:70%;animation-duration:110s;animation-delay:-60s}
  @keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(60vw)}}
  .sky .shoot{inset:auto;top:12%;left:70%;width:140px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:2px;transform:rotate(-18deg);opacity:0;animation:shoot 9s ease-in 3s infinite}
  @keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-18deg)}3%{opacity:1}9%{opacity:0;transform:translate(-320px,105px) rotate(-18deg)}100%{opacity:0}}
  .fire{position:absolute;inset:0;pointer-events:none;background:radial-gradient(3px 3px at 20% 70%,rgba(255,220,120,.9),transparent),radial-gradient(2px 2px at 80% 60%,rgba(255,220,120,.8),transparent),radial-gradient(2px 2px at 35% 55%,rgba(180,255,160,.7),transparent),radial-gradient(2px 2px at 65% 75%,rgba(255,220,120,.7),transparent);animation:ff 6s ease-in-out infinite alternate;opacity:.7}
  @keyframes ff{to{transform:translateY(-14px);opacity:.35}}
  .card{position:relative;z-index:5;width:100%;max-width:980px;text-align:center}
  .logoimg{display:block;width:min(720px,92vw);height:auto;margin:-6px auto 6px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.45))}
  .tagline{font:800 clamp(22px,2.6vw,34px)/1.2 "Segoe UI",sans-serif;margin:0 0 12px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.6)}
  .tagline b.g{color:#ffd23f} .tagline b.z{color:#5dfc6a}
  .sub{color:#e3e8ff;margin:0 auto 18px;font-size:16px;max-width:620px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .chips{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;letter-spacing:.2px;padding:9px 18px;border-radius:999px;background:rgba(8,14,30,.7);backdrop-filter:blur(4px)}
  .chip svg{width:18px;height:18px}
  .chip.net{color:#4dff9a;border:1.5px solid rgba(61,220,132,.75)}
  .chip.beta{color:#d7b4ff;border:1.5px solid rgba(180,107,255,.8)}
  .btn{position:relative;display:flex;width:min(460px,100%);margin:0 auto;align-items:center;justify-content:center;gap:12px;border:0;cursor:pointer;font:800 20px "Segoe UI",sans-serif;padding:17px 56px;border-radius:16px;color:#2a1300;text-decoration:none;
       background:linear-gradient(180deg,#ffc35e,#ff9f2e 55%,#ee7d12);box-shadow:0 5px 0 #8a3f06,inset 0 1px 0 rgba(255,255,255,.45),0 14px 34px rgba(255,159,67,.4);transition:transform .08s,box-shadow .08s,filter .15s}
  #connectBtn::after{content:"\203A";position:absolute;right:22px;top:50%;transform:translateY(-54%);font-size:32px;font-weight:900}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a3f06}
  .btn:disabled{filter:grayscale(.8) brightness(.6);cursor:wait;transform:none}
  .btn svg{width:30px;height:30px}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:#2a1300;animation:sp .8s linear infinite;display:none}
  .btn.busy .spin{display:inline-block}
  .btn.busy::after{display:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .status{min-height:22px;margin:10px auto 0;font-size:14px;color:#e3e8ff;max-width:560px;text-shadow:0 1px 6px rgba(0,0,0,.9)}
  .status.err{color:#ff8a9d} .status.ok{color:var(--green)}
  .who{display:none;margin:10px auto 0;max-width:460px;padding:9px 12px;border-radius:10px;background:rgba(8,12,28,.8);border:1px solid var(--line);font:12px ui-monospace,Consolas,monospace;color:var(--mut);word-break:break-all;text-align:left}
  .who b{color:var(--txt)}
  .code{display:none;margin:10px auto 0;max-width:460px;text-align:left;background:rgba(8,12,28,.88);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .code textarea{width:100%;height:64px;resize:none;background:#0a0c16;color:var(--cyan);border:1px solid var(--line);border-radius:8px;padding:8px;font:11px ui-monospace,Consolas,monospace}
  .code button{margin-top:6px;background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 10px;cursor:pointer;font:700 12px "Segoe UI",sans-serif}
  .note{margin:12px 0 0;font-size:13px;color:#d3d9f5;text-shadow:0 1px 6px rgba(0,0,0,.9)}

  /* ---------- feature strip ---------- */
  .feats{position:relative;z-index:6;margin:auto 0 26px;padding-top:40px;width:min(1540px,calc(100% - 28px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
  .feat{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:rgba(10,14,32,.82);backdrop-filter:blur(6px);border:1px solid rgba(120,140,220,.22);box-shadow:0 10px 24px rgba(0,0,0,.35)}
  .feat img{width:70px;height:70px;flex-shrink:0}
  .feat b{display:block;font-size:17px;color:#fff;margin-bottom:3px}
  .feat b.gold{color:#ffd23f}
  .feat span{display:block;color:#c3cbea;font-size:14px;line-height:1.35}
  @media (max-width:1100px){.feats{grid-template-columns:repeat(3,minmax(0,1fr))}.nav{gap:18px}}

  /* ---------- sections ---------- */
  section.sec{position:relative;padding:80px 20px;max-width:1120px;margin:0 auto}
  .sec h2{font:900 36px/1.1 Impact,"Arial Black",sans-serif;letter-spacing:.5px;margin:0 0 8px;text-align:center;background:linear-gradient(180deg,#fff6c2,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sec .lead{color:var(--mut);text-align:center;margin:0 auto 36px;max-width:620px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
  .step{position:relative;background:linear-gradient(180deg,#171c33,#11152a);border:1px solid #283160;border-radius:16px;padding:18px 18px 16px 18px;transition:transform .15s,border-color .15s}

s3t:"Hold the lanes",s3p:"Zombie traders march in from the right in waves. New lanes open as the waves climb, so cover every row before it's too late.",
s4t:"Upgrade wisely",s4p:"Select a plant to level it up for more yield and power. High-level upgrades can RUG — the higher you push, the bigger the risk.",
s5t:"Pay your rent",s5p:"Garden rent is due every 5 minutes. Miss it and your income drops 80% while zombies move 50% faster.",
s6t:"Stop the Whale Boss",s6p:"Every 10th wave a Whale Boss rolls in. If it reaches the left edge: MARKET CRASH and your run is over.",
s7t:"Don't leak",s7p:"If 10 zombies slip past your defense, it collapses and 10% of your Bag burns.",
s8t:"Rebirth stronger",s8p:"A crash isn't the end. The coins you spent turn into Golden Fertilizer — an income multiplier for the rest of the day.",
k_pick:"select plant",k_cancel:"cancel",k_pause:"pause",k_view:"switch view",
econ_title:"From Coins to Rewards",econ_lead:"Your in-game $COIN keeps the garden running. Your Bag is what you take home.",
bag_t:"Bag",bag_p:"1% of every $COIN you earn drops into your Bag. Premium Pass boosts can raise this rate for a while.",
pool_t:"Daily Pool",pool_p:"Deposit your Bag into the daily reward pool. When the day ends, the reward is split by everyone's share.",
bank_t:"Bank",bank_p:"Your pool share lands in your Bank. Withdraw it, or convert it back into in-game $COIN.",
garden_t:"Garden & Seeds",garden_p:"Mystery Boxes drop rare seeds. Plant them in your Garden for daily Bank income, or merge 3 of the same rarity to roll a rarer one.",
pass_t:"Premium Pass",pass_p:"Defeat zombies to earn XP and unlock rewards: boxes, seeds and temporary coin and Bag-rate boosts.",
nft_t:"Character NFT",nft_p:"Mint a random plant or zombie character to join the daily pool. Leaks damage it — repair it to keep playing.",
faq_title:"FAQ",q1:"Who can play right now?",a1:"Plant vs. Yield is in closed beta. Only invited wallets can enter for now — public access is coming later.",
q2:"Does connecting my wallet cost anything?",a2:"No. You only sign a message to prove you own the wallet. It isn't a transaction and costs no gas.",
q3:"Which network does the game use?",a3:"The game runs on Robinhood Chain. If your wallet is on another network, MetaMask will ask you to switch.",
q4:"Do I need to install anything?",a4:"Just a desktop browser with the MetaMask extension. The game runs right in your browser — nothing to download.",
q5:"Is my progress saved?",a5:"Yes. Your garden, seeds and settings are saved in your browser on this device.",
cta:"Connect & Play",footer:"© 2026 Plant vs. Yield · Closed Beta"},
es:{nav_how:"Cómo jugar",nav_econ:"Economía",nav_faq:"Preguntas",tagline:"Planta. Cosecha $COIN. Sobrevive al mercado zombi.",sub:"Un juego de defensa y rendimiento donde tu jardín es tu cartera. Construye una máquina de dinero, frena a los traders zombis y que no te hagan rug.",chip_beta:"Beta cerrada",
btn_connect:"Conectar MetaMask",btn_connecting:"Conectando cartera…",btn_network:"Comprobando red…",btn_sign:"Esperando firma…",btn_other:"Probar otra cartera",btn_retry:"Reintentar",
st_nomm:"No se encontró MetaMask. Instala la extensión de MetaMask para continuar.",st_denied:"Esta cartera no tiene acceso. La beta cerrada es solo por invitación.",st_signhint:"Aprueba la solicitud de firma en MetaMask (gratis).",st_loading:"Cargando el juego…",st_fail:"No se pudo abrir el juego. Asegúrate de firmar con la cartera invitada.",st_rejected:"Solicitud rechazada.",st_err:"Error de conexión: ",
who:"Cartera conectada:",enroll:"Esta cartera está invitada pero aún no está activada. Envía este código de activación al desarrollador (solo a alguien de confianza):",copy:"Copiar código",copied:"¡Copiado!",note:"Solo las carteras invitadas pueden entrar. Firmar es gratis y no es una transacción.",scroll:"Cómo jugar ↓",
how_title:"Cómo jugar",how_lead:"Todo lo que necesitas para sobrevivir a tu primer ciclo de mercado.",
s1t:"Planta tu cartera",s1p:"Elige una planta del Mercado y colócala en un carril abierto. Los productores generan $COIN cada segundo; los tiradores y muros los protegen.",
s2t:"La sinergia se acumula",s2p:"Cada planta aumenta tus ingresos totales un 4%. Un jardín más grande gana más rápido, pero también hay más que defender.",
s3t:"Defiende los carriles",s3p:"Los traders zombis llegan por la derecha en oleadas. Se abren nuevos carriles al subir de oleada: cubre cada fila a tiempo.",
s4t:"Mejora con cabeza",s4p:"Selecciona una planta para subirla de nivel. Las mejoras de nivel alto pueden hacer RUG: cuanto más subes, mayor el riesgo.",
s5t:"Paga el alquiler",s5p:"El alquiler del jardín vence cada 5 minutos. Si no pagas, tus ingresos bajan un 80% y los zombis van un 50% más rápido.",
s6t:"Detén al Whale Boss",s6p:"Cada 10 oleadas llega un Whale Boss. Si alcanza el borde izquierdo: MARKET CRASH y se acaba la partida.",
s7t:"Que no se cuelen",s7p:"Si 10 zombis atraviesan tu defensa, esta colapsa y se quema el 10% de tu Bolsa.",
s8t:"Renace más fuerte",s8p:"Un crash no es el final. Las monedas gastadas se convierten en Fertilizante Dorado, un multiplicador de ingresos para el resto del día.",
k_pick:"elegir planta",k_cancel:"cancelar",k_pause:"pausa",k_view:"cambiar vista",
econ_title:"De monedas a recompensas",econ_lead:"Tus $COIN del juego mantienen el jardín. Tu Bolsa es lo que te llevas.",
bag_t:"Bolsa",bag_p:"El 1% de cada $COIN que ganas va a tu Bolsa. Las mejoras del Premium Pass pueden subir este porcentaje temporalmente.",
pool_t:"Fondo diario",pool_p:"Deposita tu Bolsa en el fondo de recompensas diario. Al acabar el día, el premio se reparte según la participación de cada uno.",
bank_t:"Banco",bank_p:"Tu parte del fondo llega a tu Banco. Retírala o conviértela de nuevo en $COIN del juego.",
garden_t:"Jardín y semillas",garden_p:"Las Mystery Box sueltan semillas raras. Plántalas en tu Jardín para ganar ingresos diarios o fusiona 3 de la misma rareza para obtener una más rara.",
pass_t:"Premium Pass",pass_p:"Derrota zombis para ganar XP y desbloquear recompensas: cajas, semillas y mejoras temporales de monedas y de Bolsa.",
nft_t:"NFT de personaje",nft_p:"Acuña un personaje aleatorio (planta o zombi) para unirte al fondo diario. Las fugas lo dañan: repáralo para seguir jugando.",
faq_title:"Preguntas frecuentes",q1:"¿Quién puede jugar ahora?",a1:"Plant vs. Yield está en beta cerrada. Por ahora solo entran carteras invitadas; el acceso público llegará más adelante.",
q2:"¿Conectar mi cartera cuesta algo?",a2:"No. Solo firmas un mensaje para demostrar que la cartera es tuya. No es una transacción y no cuesta gas.",
q3:"¿Qué red usa el juego?",a3:"El juego funciona en Robinhood Chain. Si tu cartera está en otra red, MetaMask te pedirá cambiarla.",
q4:"¿Tengo que instalar algo?",a4:"Solo un navegador de escritorio con la extensión MetaMask. El juego funciona en el navegador, sin descargas.",
q5:"¿Se guarda mi progreso?",a5:"Sí. Tu jardín, semillas y ajustes se guardan en el navegador de este dispositivo.",
cta:"Conectar y jugar",footer:"© 2026 Plant vs. Yield · Beta cerrada"},
pt:{nav_how:"Como jogar",nav_econ:"Economia",nav_faq:"Perguntas",tagline:"Plante. Colha $COIN. Sobreviva ao mercado zumbi.",sub:"Um jogo de defesa e rendimento em que seu jardim é sua carteira. Monte uma máquina de dinheiro, segure os traders zumbis e não leve rug.",chip_beta:"Beta fechado",
btn_connect:"Conectar MetaMask",btn_connecting:"Conectando carteira…",btn_network:"Verificando rede…",btn_sign:"Aguardando assinatura…",btn_other:"Tentar outra carteira",btn_retry:"Tentar de novo",
st_nomm:"MetaMask não encontrada. Instale a extensão MetaMask para continuar.",st_denied:"Esta carteira não tem acesso. O beta fechado é só para convidados.",st_signhint:"Aprove o pedido de assinatura na MetaMask (grátis).",st_loading:"Carregando o jogo…",st_fail:"Não foi possível abrir o jogo. Confira se assinou com a carteira convidada.",st_rejected:"Pedido recusado.",st_err:"Erro de conexão: ",
who:"Carteira conectada:",enroll:"Esta carteira foi convidada, mas ainda não foi ativada. Envie este código de ativação ao desenvolvedor (só para alguém de confiança):",copy:"Copiar código",copied:"Copiado!",note:"Só carteiras convidadas podem entrar. Assinar é grátis e não é uma transação.",scroll:"Como jogar ↓",
how_title:"Como jogar",how_lead:"Tudo o que você precisa para sobreviver ao seu primeiro ciclo de mercado.",
s1t:"Plante sua carteira",s1p:"Escolha uma planta no Mercado e coloque-a numa pista aberta. Produtores geram $COIN a cada segundo; atiradores e muros os protegem.",
s2t:"Sinergia acumulada",s2p:"Cada planta aumenta sua renda total em 4%. Um jardim maior rende mais rápido, mas também dá mais trabalho para defender.",
s3t:"Segure as pistas",s3p:"Traders zumbis chegam pela direita em ondas. Novas pistas abrem conforme as ondas sobem — cubra cada linha a tempo.",
s4t:"Evolua com cuidado",s4p:"Selecione uma planta para subir de nível. Melhorias de nível alto podem dar RUG: quanto mais alto, maior o risco.",
s5t:"Pague o aluguel",s5p:"O aluguel do jardim vence a cada 5 minutos. Se atrasar, sua renda cai 80% e os zumbis ficam 50% mais rápidos.",
s6t:"Pare o Whale Boss",s6p:"A cada 10 ondas chega um Whale Boss. Se ele alcançar a borda esquerda: MARKET CRASH e a partida acaba.",
s7t:"Não deixe vazar",s7p:"Se 10 zumbis passarem pela sua defesa, ela desmorona e 10% da sua Bolsa queima.",
s8t:"Renasça mais forte",s8p:"Um crash não é o fim. As moedas gastas viram Fertilizante Dourado, um multiplicador de renda para o resto do dia.",
k_pick:"escolher planta",k_cancel:"cancelar",k_pause:"pausar",k_view:"trocar visão",
econ_title:"De moedas a recompensas",econ_lead:"Seus $COIN do jogo mantêm o jardim. Sua Bolsa é o que você leva para casa.",
bag_t:"Bolsa",bag_p:"1% de cada $COIN que você ganha vai para a Bolsa. Bônus do Premium Pass podem aumentar essa taxa por um tempo.",
pool_t:"Pool diário",pool_p:"Deposite sua Bolsa no pool de recompensas diário. No fim do dia, o prêmio é dividido pela participação de cada um.",
bank_t:"Banco",bank_p:"Sua parte do pool cai no seu Banco. Saque ou converta de volta em $COIN do jogo.",
garden_t:"Jardim e sementes",garden_p:"Mystery Boxes soltam sementes raras. Plante-as no Jardim para renda diária ou funda 3 da mesma raridade para tirar uma mais rara.",
pass_t:"Premium Pass",pass_p:"Derrote zumbis para ganhar XP e liberar recompensas: caixas, sementes e bônus temporários de moedas e de Bolsa.",
nft_t:"NFT de personagem",nft_p:"Crie um personagem aleatório (planta ou zumbi) para entrar no pool diário. Vazamentos o danificam — conserte para continuar jogando.",
faq_title:"Perguntas frequentes",q1:"Quem pode jogar agora?",a1:"Plant vs. Yield está em beta fechado. Por enquanto só carteiras convidadas entram; o acesso público vem depois.",
q2:"Conectar a carteira custa algo?",a2:"Não. Você só assina uma mensagem para provar que a carteira é sua. Não é uma transação e não custa gas.",
q3:"Qual rede o jogo usa?",a3:"O jogo roda na Robinhood Chain. Se sua carteira estiver em outra rede, a MetaMask pedirá para trocar.",
q4:"Preciso instalar algo?",a4:"Só um navegador de computador com a extensão MetaMask. O jogo roda no navegador, sem downloads.",
q5:"Meu progresso fica salvo?",a5:"Sim. Seu jardim, sementes e configurações ficam salvos no navegador deste dispositivo.",
cta:"Conectar e jogar",footer:"© 2026 Plant vs. Yield · Beta fechado"},
fr:{nav_how:"Comment jouer",nav_econ:"Économie",nav_faq:"FAQ",tagline:"Plantez. Récoltez des $COIN. Survivez au marché zombie.",sub:"Un jeu de défense et de rendement où votre jardin est votre portefeuille. Bâtissez une machine à cash, repoussez les traders zombies et ne vous faites pas rugger.",chip_beta:"Bêta fermée",
btn_connect:"Connecter MetaMask",btn_connecting:"Connexion du portefeuille…",btn_network:"Vérification du réseau…",btn_sign:"En attente de signature…",btn_other:"Essayer un autre portefeuille",btn_retry:"Réessayer",
st_nomm:"MetaMask introuvable. Installez l’extension MetaMask pour continuer.",st_denied:"Ce portefeuille n’a pas accès. La bêta fermée est sur invitation.",st_signhint:"Approuvez la demande de signature dans MetaMask (gratuit).",st_loading:"Chargement du jeu…",st_fail:"Impossible d’ouvrir le jeu. Vérifiez que vous avez signé avec le portefeuille invité.",st_rejected:"Demande refusée.",st_err:"Erreur de connexion : ",
who:"Portefeuille connecté :",enroll:"Ce portefeuille est invité mais pas encore activé. Envoyez ce code d’activation au développeur (uniquement à une personne de confiance) :",copy:"Copier le code",copied:"Copié !",note:"Seuls les portefeuilles invités peuvent entrer. Signer est gratuit et n’est pas une transaction.",scroll:"Comment jouer ↓",
how_title:"Comment jouer",how_lead:"Tout ce qu’il faut pour survivre à votre premier cycle de marché.",
s1t:"Plantez votre portefeuille",s1p:"Choisissez une plante au Marché et placez-la sur une ligne ouverte. Les producteurs génèrent des $COIN chaque seconde ; tireurs et murs les protègent.",
s2t:"La synergie s’additionne",s2p:"Chaque plante augmente vos revenus totaux de 4 %. Un plus grand jardin rapporte plus vite, mais il y a plus à défendre.",
s3t:"Tenez les lignes",s3p:"Les traders zombies arrivent par la droite, par vagues. De nouvelles lignes s’ouvrent au fil des vagues : couvrez chaque rangée à temps.",
s4t:"Améliorez avec prudence",s4p:"Sélectionnez une plante pour la faire monter de niveau. À haut niveau, une amélioration peut RUG : plus vous montez, plus le risque grandit.",
s5t:"Payez le loyer",s5p:"Le loyer du jardin tombe toutes les 5 minutes. En cas d’impayé, vos revenus chutent de 80 % et les zombies vont 50 % plus vite.",
s6t:"Arrêtez le Whale Boss",s6p:"Toutes les 10 vagues, un Whale Boss débarque. S’il atteint le bord gauche : MARKET CRASH, la partie est finie.",
s7t:"Pas de fuite",s7p:"Si 10 zombies franchissent votre défense, elle s’effondre et 10 % de votre Sac brûle.",
s8t:"Renaissez plus fort",s8p:"Un crash n’est pas la fin. Les pièces dépensées deviennent de l’Engrais Doré, un multiplicateur de revenus pour le reste de la journée.",
k_pick:"choisir une plante",k_cancel:"annuler",k_pause:"pause",k_view:"changer de vue",
econ_title:"Des pièces aux récompenses",econ_lead:"Vos $COIN en jeu font tourner le jardin. Votre Sac, c’est ce que vous emportez.",
bag_t:"Sac",bag_p:"1 % de chaque $COIN gagné tombe dans votre Sac. Les bonus du Premium Pass peuvent augmenter ce taux temporairement.",
pool_t:"Cagnotte du jour",pool_p:"Déposez votre Sac dans la cagnotte quotidienne. En fin de journée, la récompense est partagée selon la part de chacun.",
bank_t:"Banque",bank_p:"Votre part de la cagnotte arrive dans votre Banque. Retirez-la ou reconvertissez-la en $COIN de jeu.",
garden_t:"Jardin et graines",garden_p:"Les Mystery Box donnent des graines rares. Plantez-les dans votre Jardin pour un revenu quotidien, ou fusionnez-en 3 de même rareté pour en obtenir une plus rare.",
pass_t:"Premium Pass",pass_p:"Battez des zombies pour gagner de l’XP et débloquer des récompenses : coffres, graines et bonus temporaires de pièces et de Sac.",
nft_t:"NFT personnage",nft_p:"Mintez un personnage aléatoire (plante ou zombie) pour rejoindre la cagnotte. Les fuites l’abîment : réparez-le pour continuer à jouer.",
faq_title:"FAQ",q1:"Qui peut jouer maintenant ?",a1:"Plant vs. Yield est en bêta fermée. Pour l’instant, seuls les portefeuilles invités peuvent entrer ; l’accès public viendra plus tard.",
q2:"Connecter mon portefeuille coûte-t-il quelque chose ?",a2:"Non. Vous signez seulement un message pour prouver que le portefeuille vous appartient. Ce n’est pas une transaction et ça ne coûte pas de gas.",
q3:"Quel réseau le jeu utilise-t-il ?",a3:"Le jeu tourne sur Robinhood Chain. Si votre portefeuille est sur un autre réseau, MetaMask vous proposera de changer.",
q4:"Dois-je installer quelque chose ?",a4:"Juste un navigateur d’ordinateur avec l’extension MetaMask. Le jeu tourne dans le navigateur, rien à télécharger.",
q5:"Ma progression est-elle sauvegardée ?",a5:"Oui. Votre jardin, vos graines et vos réglages sont enregistrés dans le navigateur de cet appareil.",
cta:"Connecter et jouer",footer:"© 2026 Plant vs. Yield · Bêta fermée"},
de:{nav_how:"So wird gespielt",nav_econ:"Wirtschaft",nav_faq:"FAQ",tagline:"Pflanzen. $COIN farmen. Den Zombie-Markt überleben.",sub:"Ein Tower-Defense-Yield-Spiel, in dem dein Garten dein Portfolio ist. Bau eine Geldmaschine, halte die Zombie-Trader auf – und lass dich nicht ruggen.",chip_beta:"Geschlossene Beta",
btn_connect:"MetaMask verbinden",btn_connecting:"Wallet wird verbunden…",btn_network:"Netzwerk wird geprüft…",btn_sign:"Warte auf Signatur…",btn_other:"Andere Wallet versuchen",btn_retry:"Erneut versuchen",
st_nomm:"MetaMask nicht gefunden. Installiere die MetaMask-Erweiterung, um fortzufahren.",st_denied:"Diese Wallet hat keinen Zugang. Die geschlossene Beta ist nur auf Einladung.",st_signhint:"Bestätige die Signaturanfrage in MetaMask (kostenlos).",st_loading:"Spiel wird geladen…",st_fail:"Das Spiel konnte nicht geöffnet werden. Stelle sicher, dass du mit der eingeladenen Wallet signiert hast.",st_rejected:"Anfrage abgelehnt.",st_err:"Verbindungsfehler: ",
who:"Verbundene Wallet:",enroll:"Diese Wallet ist eingeladen, aber noch nicht aktiviert. Sende diesen Aktivierungscode an den Entwickler (nur an jemanden, dem du vertraust):",copy:"Code kopieren",copied:"Kopiert!",note:"Nur eingeladene Wallets kommen rein. Signieren ist kostenlos und keine Transaktion.",scroll:"So wird gespielt ↓",
how_title:"So wird gespielt",how_lead:"Alles, was du brauchst, um deinen ersten Marktzyklus zu überleben.",
s1t:"Pflanze dein Portfolio",s1p:"Wähle eine Pflanze im Markt und setze sie auf eine offene Bahn. Produzenten erzeugen jede Sekunde $COIN; Schützen und Mauern halten sie am Leben.",
s2t:"Synergie stapelt sich",s2p:"Jede Pflanze erhöht dein Gesamteinkommen um 4 %. Ein größerer Garten verdient schneller – muss aber auch mehr verteidigen.",
s3t:"Halte die Bahnen",s3p:"Zombie-Trader marschieren in Wellen von rechts heran. Mit steigenden Wellen öffnen sich neue Bahnen – sichere jede Reihe rechtzeitig.",
s4t:"Klug upgraden",s4p:"Wähle eine Pflanze aus, um sie aufzuleveln. Hohe Upgrades können RUGGEN – je höher du gehst, desto größer das Risiko.",
s5t:"Zahl die Miete",s5p:"Alle 5 Minuten ist die Gartenmiete fällig. Verpasst du sie, sinkt dein Einkommen um 80 % und Zombies werden 50 % schneller.",
s6t:"Stopp den Whale Boss",s6p:"Jede 10. Welle rollt ein Whale Boss an. Erreicht er den linken Rand: MARKET CRASH, die Runde ist vorbei.",
s7t:"Nichts durchlassen",s7p:"Schlüpfen 10 Zombies durch deine Verteidigung, bricht sie zusammen und 10 % deiner Tasche verbrennen.",
s8t:"Stärker wiedergeboren",s8p:"Ein Crash ist nicht das Ende. Ausgegebene Münzen werden zu Golddünger – einem Einkommensmultiplikator für den Rest des Tages.",
k_pick:"Pflanze wählen",k_cancel:"abbrechen",k_pause:"Pause",k_view:"Ansicht wechseln",
econ_title:"Von Münzen zu Belohnungen",econ_lead:"Deine Spiel-$COIN halten den Garten am Laufen. Deine Tasche ist das, was du mitnimmst.",
bag_t:"Tasche",bag_p:"1 % jeder verdienten $COIN fließt in deine Tasche. Premium-Pass-Boni können diese Rate eine Zeit lang erhöhen.",
pool_t:"Tagespool",pool_p:"Zahle deine Tasche in den täglichen Belohnungspool ein. Am Tagesende wird die Belohnung nach Anteilen verteilt.",
bank_t:"Bank",bank_p:"Dein Poolanteil landet in deiner Bank. Hebe ihn ab oder wandle ihn wieder in Spiel-$COIN um.",
garden_t:"Garten & Samen",garden_p:"Mystery Boxes liefern seltene Samen. Pflanze sie für tägliches Bankeinkommen in deinen Garten oder verschmelze 3 gleicher Seltenheit zu einem selteneren.",
pass_t:"Premium Pass",pass_p:"Besiege Zombies für XP und schalte Belohnungen frei: Kisten, Samen sowie zeitlich begrenzte Münz- und Taschen-Boni.",
nft_t:"Charakter-NFT",nft_p:"Minte einen zufälligen Pflanzen- oder Zombie-Charakter, um dem Tagespool beizutreten. Lecks beschädigen ihn – repariere ihn, um weiterzuspielen.",
faq_title:"FAQ",q1:"Wer kann gerade spielen?",a1:"Plant vs. Yield ist in der geschlossenen Beta. Vorerst kommen nur eingeladene Wallets rein – der öffentliche Zugang folgt später.",
q2:"Kostet das Verbinden meiner Wallet etwas?",a2:"Nein. Du signierst nur eine Nachricht, um zu beweisen, dass dir die Wallet gehört. Das ist keine Transaktion und kostet kein Gas.",
q3:"Welches Netzwerk nutzt das Spiel?",a3:"Das Spiel läuft auf Robinhood Chain. Ist deine Wallet in einem anderen Netzwerk, fragt MetaMask nach einem Wechsel.",
q4:"Muss ich etwas installieren?",a4:"Nur einen Desktop-Browser mit der MetaMask-Erweiterung. Das Spiel läuft direkt im Browser – kein Download nötig.",
q5:"Wird mein Fortschritt gespeichert?",a5:"Ja. Garten, Samen und Einstellungen werden im Browser dieses Geräts gespeichert.",
cta:"Verbinden & spielen",footer:"© 2026 Plant vs. Yield · Geschlossene Beta"},
ru:{nav_how:"Как играть",nav_econ:"Экономика",nav_faq:"Вопросы",tagline:"Сажай. Фарми $COIN. Переживи зомби-рынок.",sub:"Игра в жанре tower defense, где твой сад — это твой портфель. Построй денежную машину, сдержи зомби-трейдеров и не попади под rug.",chip_beta:"Закрытая бета",
btn_connect:"Подключить MetaMask",btn_connecting:"Подключение кошелька…",btn_network:"Проверка сети…",btn_sign:"Ожидание подписи…",btn_other:"Другой кошелёк",btn_retry:"Повторить",
st_nomm:"MetaMask не найден. Установи расширение MetaMask, чтобы продолжить.",st_denied:"У этого кошелька нет доступа. Закрытая бета — только по приглашениям.",st_signhint:"Подтверди запрос на подпись в MetaMask (бесплатно).",st_loading:"Загрузка игры…",st_fail:"Не удалось открыть игру. Убедись, что подписал приглашённым кошельком.",st_rejected:"Запрос отклонён.",st_err:"Ошибка подключения: ",

how_title:"玩法",how_lead:"度过第一个市场周期所需的一切。",
s1t:"种下你的投资组合",s1p:"从商店选择植物，放到开放的赛道上。生产型植物每秒产出 $COIN，射手和墙负责保护它们。",
s2t:"协同叠加",s2p:"每株植物使总收入提高 4%。花园越大赚得越快，但需要防守的也越多。",
s3t:"守住赛道",s3p:"僵尸交易员从右侧成波来袭。随着波数上升会开放新赛道，及时守住每一行。",
s4t:"谨慎升级",s4p:"选中植物即可升级，获得更高收益和战力。高等级升级可能 RUG——升得越高，风险越大。",
s5t:"按时交租",s5p:"花园租金每 5 分钟到期一次。逾期后收入下降 80%，僵尸速度提升 50%。",

s8t:"重生更强",s8p:"崩盘不是终点。花掉的金币会变成金色肥料——在当天剩余时间内提供收入倍率。",

bag_t:"背包",bag_p:"你赚到的每个 $COIN 中有 1% 进入背包。Premium Pass 加成可在一段时间内提高这一比例。",
pool_t:"每日奖池",pool_p:"把背包存入每日奖池。每天结束时，奖励按每个人的份额分配。",
bank_t:"银行",bank_p:"你的奖池份额会进入银行。可以提取，也可以换回游戏内 $COIN。",
garden_t:"花园与种子",garden_p:"神秘箱会掉落稀有种子。种在花园里获得每日银行收入，或将 3 颗同稀有度种子合成为更稀有的一颗。",
pass_t:"Premium Pass",pass_p:"击败僵尸获得经验并解锁奖励：箱子、种子以及临时的金币和背包加成。",
nft_t:"角色 NFT",nft_p:"铸造一个随机植物或僵尸角色即可加入每日奖池。漏怪会损坏角色——修复后才能继续游戏。",

q5:"进度会保存吗？",a5:"会。你的花园、种子和设置保存在这台设备的浏览器中。",

/* ===== helpers ===== */
const $ = id => document.getElementById(id);
let stKey = null, stExtra = '';
const setStatus = (k, c, extra) => { stKey = k; stExtra = extra || ''; const s = $('status'); s.textContent = k ? t(k) + stExtra : ''; s.className = 'status ' + (c || ''); };
const busy = (on, k) => { const b = $('connectBtn'); b.disabled = on; b.classList.toggle('busy', on); if (k) { btnKey = k; $('btnTxt').textContent = t(k); } };
const hex2buf = h => { h = h.replace(/^0x/, ''); const u = new Uint8Array(h.length / 2); for (let i = 0; i < u.length; i++) u[i] = parseInt(h.substr(i * 2, 2), 16); return u; };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const short = a => a.slice(0, 6) + '…' + a.slice(-4);

/* ===== wallet + unlock ===== */
// Birden fazla cüzdan eklentisi (Coinbase, Rabby, Phantom...) window.ethereum'u ele geçirebilir.
// EIP-6963 ile hepsini listeleyip MetaMask'ı seçiyoruz; yoksa kullanıcıya seçtiriyoruz.
const WALLETS = new Map();
addEventListener('eip6963:announceProvider', e => { const d = e.detail; if (d && d.info && d.provider) WALLETS.set(d.info.uuid || d.info.rdns, d); });
dispatchEvent(new Event('eip6963:requestProvider'));
function legacyList() {
  const eth = window.ethereum; if (!eth) return [];
  const arr = Array.isArray(eth.providers) && eth.providers.length ? eth.providers : [eth];
  return arr.map((p, i) => ({ info: { uuid: 'legacy' + i, name: p.isMetaMask && !p.isCoinbaseWallet && !p.isBraveWallet && !p.isRabby && !p.isPhantom ? 'MetaMask' : p.isCoinbaseWallet ? 'Coinbase Wallet' : p.isRabby ? 'Rabby' : p.isPhantom ? 'Phantom' : 'Wallet', rdns: p.isMetaMask && !p.isCoinbaseWallet && !p.isRabby && !p.isPhantom ? 'io.metamask' : '', icon: '' }, provider: p }));
}
function pickFrom(list) {
  return new Promise(res => {
    const box = $('wpick'), ul = $('wpickList'); ul.innerHTML = '';
    list.forEach(w => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = (w.info.icon ? '<img src="' + w.info.icon + '" alt="">' : '<i></i>') + '<span></span>'; b.querySelector('span').textContent = w.info.name; b.onclick = () => { box.hidden = true; res(w.provider); }; ul.appendChild(b); });
    $('wpickClose').onclick = () => { box.hidden = true; res(null); };
    box.hidden = false;
  });
}
async function getProvider() {
  if (!WALLETS.size) { dispatchEvent(new Event('eip6963:requestProvider')); await new Promise(r => setTimeout(r, 350)); }
  const list = WALLETS.size ? [...WALLETS.values()] : legacyList();
  if (!list.length) return null;
  const mm = list.find(w => /^io\.metamask/.test(w.info.rdns || ''));
  if (mm) return mm.provider;
  if (list.length === 1) return list[0].provider;
  return pickFrom(list);
}
async function ensureChain(eth) {
  if (!CHAIN) return;
  const cur = await eth.request({ method: 'eth_chainId' });
  if (cur.toLowerCase() === CHAIN.chainId.toLowerCase()) return;
  try { await eth.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN.chainId }] }); }
  catch (e) {
    if (e && (e.code === 4902 || /Unrecognized|not been added/i.test(e.message || ''))) await eth.request({ method: 'wallet_addEthereumChain', params: [CHAIN] });
    else throw e;
  }
}
function showEnroll(addr, keyRaw) { $('codeBox').style.display = 'block'; $('codeTxt').value = addr + ':' + b64e(keyRaw); }
async function openGame(addr, keyRaw) {
  setStatus('st_loading');
  const keys = await (await fetch('keys.json', { cache: 'no-store' })).json();
  const ents = [].concat(keys[addr] || []); if (!ents.length) throw new Error('nokey');
  const kek = await crypto.subtle.importKey('raw', keyRaw, 'AES-GCM', false, ['decrypt']);
  let cek = null;
  for (const ent of ents) { try { cek = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(ent.iv) }, kek, b64d(ent.k)); break; } catch (e) {} }
  if (!cek) throw new Error('nokey');
  const ck = await crypto.subtle.importKey('raw', cek, 'AES-GCM', false, ['decrypt']);
  const enc = new Uint8Array(await (await fetch('game.enc', { cache: 'no-store' })).arrayBuffer());
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: enc.slice(0, 12) }, ck, enc.slice(12));
  const html = new TextDecoder().decode(plain);
  try { sessionStorage.setItem('pvy_wallet', addr); localStorage.setItem('pvy_lang', lang); } catch (e) {}
  window.PVY_WALLET = addr;
  document.open(); document.write(html); document.close();
}
async function connect() {
  const eth = await getProvider();
  if (!eth) { setStatus('st_nomm', 'err'); window.open('https://metamask.io/download/', '_blank', 'noopener'); return; }
  try {
    busy(true, 'btn_connecting'); setStatus(null); $('codeBox').style.display = 'none';
    const [acc] = await eth.request({ method: 'eth_requestAccounts' });
    const addr = acc.toLowerCase();
    $('who').style.display = 'block'; $('who').innerHTML = '<span data-i="who">' + t('who') + '</span> <b>' + short(acc) + '</b>';
    busy(true, 'btn_network'); await ensureChain(eth);
    if (!ALLOW.includes(addr)) { busy(false, 'btn_other'); setStatus('st_denied', 'err'); return; }
    busy(true, 'btn_sign'); setStatus('st_signhint');
    const sig = await eth.request({ method: 'personal_sign', params: [SIGN_MSG(addr), acc] });
    const keyRaw = await crypto.subtle.digest('SHA-256', hex2buf(sig));
    try { await openGame(addr, keyRaw); }
    catch (e) {
      if (e.message === 'nokey') { busy(false, 'btn_connect'); setStatus(null); showEnroll(addr, keyRaw); return; }
      busy(false, 'btn_retry'); setStatus('st_fail', 'err'); console.error(e);
    }
  } catch (e) {
    busy(false, 'btn_connect');
    if (e && e.code === 4001) setStatus('st_rejected', 'err'); else setStatus('st_err', 'err', (e && e.message) || String(e));
  }
}
